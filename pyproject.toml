[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "veriloom"
version = "1.0.0"
description = "VeriLoom - Repository-Aware Coding Task Factory & Benchmark Validation Platform"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "pydantic>=2.10.0",
    "fastapi>=0.115.0",
    "uvicorn>=0.30.0",
    "click>=8.1.0",
    "httpx>=0.27.0",
    "python-dotenv>=1.0.0",
]

[project.scripts]
veriloom = "veriloom.cli.main:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["veriloom*"]
exclude = ["api*", "exports*", "tests*", "scripts*", "examples*", "docs*"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
asyncio_default_fixture_loop_scope = "function"

